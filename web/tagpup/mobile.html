<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>TagPup</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="mobile-icon-192.png">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="common/roots-banner.css">
    <link rel="stylesheet" href="common/dark-select.css">
    <link rel="stylesheet" href="common/image-zoom.css">
</head>
<body>
    <div id="roots-banner" class="roots-banner hidden" role="alert">
        <strong>This computer does not know where this library keeps its photos.</strong>
        <span class="roots-banner-message"></span>
    </div>

    <header class="bar">
        <button type="button" id="bar-back" class="bar-back hidden" aria-label="Back">&#8592;</button>
        <h1 id="bar-title" class="bar-title">TagPup</h1>
    </header>

    <main>
        <section class="screen hidden" data-screen="browse">
            <div id="browse-top">
                <form id="browse-search" class="browse-search" role="search">
                    <input type="search" id="browse-words" class="browse-words" placeholder="Words" aria-label="Words to search for"
                        autocomplete="off" enterkeyhint="search">
                    <button type="submit" class="browse-search-go">Search</button>
                </form>
                <p id="browse-link-problem" class="problem hidden" role="alert"></p>
                <div class="browse-sections">
                    <button type="button" class="browse-section" data-section="folders">Folders</button>
                    <button type="button" class="browse-section" data-section="keywords">Keywords</button>
                    <button type="button" class="browse-section" data-section="people">People</button>
                    <button type="button" class="browse-section" data-section="dates">Dates</button>
                </div>
            </div>
            <div id="browse-level" class="hidden">
                <button type="button" id="browse-up" class="browse-up"><span aria-hidden="true">&#8592;</span> <span id="browse-path"></span></button>
                <button type="button" id="browse-show" class="browse-show hidden">Show these photos</button>
                <p id="browse-note" class="screen-note hidden"></p>
                <div id="browse-problem" class="problem hidden" role="alert">
                    <p id="browse-problem-text"></p>
                    <button type="button" id="browse-retry" class="problem-retry">Try again</button>
                </div>
                <div id="browse-rows" class="browse-rows"></div>
            </div>
        </section>

        <section class="screen grid-screen hidden" data-screen="grid" data-title="Photos">
            <h2 id="grid-heading" class="grid-heading"></h2>
            <div class="grid-choices">
                <select id="grid-order" class="grid-choice" aria-label="Order"></select>
                <select id="grid-media" class="grid-choice" aria-label="Show"></select>
            </div>
            <p id="grid-count" class="grid-count"></p>
            <div id="grid-problem" class="problem hidden" role="alert">
                <p id="grid-problem-text"></p>
                <button type="button" id="grid-retry" class="problem-retry">Try again</button>
            </div>
            <div id="grid-cards" class="grid-cards"></div>
        </section>

        <section class="screen hidden" data-screen="photo" data-title="Photo">
            <div id="photo-stage" class="photo-stage">
                <img id="photo-picture" class="photo-picture hidden" alt="The photo">
                <video id="photo-clip" class="photo-clip hidden" controls playsinline preload="metadata"></video>
            </div>
            <p id="photo-problem" class="problem hidden" role="alert"></p>
            <h2 id="photo-name" class="photo-name"></h2>
            <p id="photo-at" class="screen-note"></p>
            <button type="button" id="photo-edit" class="photo-edit">Edit</button>
            <div id="edit-sheet" class="edit-sheet hidden" role="dialog" aria-label="Edit this photo">
                <p id="edit-problem" class="edit-problem hidden" role="alert"></p>
                <h3 class="edit-heading">People</h3>
                <div id="edit-people" class="edit-chips"></div>
                <h3 class="edit-heading">Keywords</h3>
                <div id="edit-keywords" class="edit-chips"></div>
                <input type="text" id="edit-add" class="edit-input" placeholder="Add a tag or a person" aria-label="Add a tag or a person"
                    autocomplete="off" enterkeyhint="done">
                <div id="edit-matches" class="edit-matches"></div>
                <label class="edit-label">Title <input type="text" id="edit-title" class="edit-input" autocomplete="off"></label>
                <div id="edit-when" class="edit-when">
                    <label class="edit-label">Date Taken <input type="date" id="edit-date" class="edit-input"></label>
                    <input type="time" id="edit-time" class="edit-input" step="1" aria-label="Time taken">
                </div>
                <div class="edit-actions">
                    <button type="button" id="edit-close" class="edit-close">Close</button>
                    <button type="button" id="edit-save" class="edit-save">Save</button>
                </div>
            </div>
        </section>

        <section class="screen hidden" data-screen="library" data-title="Libraries">
            <div id="library-list" class="library-list"></div>
            <div id="library-problem" class="problem hidden" role="alert">
                <p>Could not load the libraries.</p>
                <button type="button" id="library-retry" class="problem-retry">Try again</button>
            </div>
        </section>
    </main>

    <!-- The bar of tabs (mobile-tabs.js): each opens its screen as a step of history. Filter is cut 3's filter sheet
         (docs/plans/phone-redesign.md): drawn, not yet something to press. -->
    <nav id="tabs" class="tabs hidden" aria-label="Screens">
        <button type="button" class="tab" data-tab="browse"><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Library</span></button>
        <button type="button" class="tab" data-tab="grid"><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Photos</span></button>
        <button type="button" class="tab" data-tab="filter" disabled><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Filter</span></button>
        <button type="button" class="tab" data-tab="library"><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Libraries</span></button>
    </nav>
    <div id="edit-toasts" class="edit-toasts" aria-live="polite"></div>

    <script type="module" src="mobile.js"></script>
</body>
</html>
