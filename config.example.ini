; TagPup's settings. Copy this file to config.ini, which setup.bat does if there is none.
;
; config.ini is not in git. It belongs to one installation, and the app writes to it:
; choosing a library remembers it in default_db. A setting config.ini leaves out takes
; the value here, from tagpup/config.py, which tests/test_config.py keeps in step with
; this file.
;
; Relative paths are relative to the folder holding config.ini (TAGPUP_HOME, or the
; code folder when that is not set). Comments go on a line of their own: a ";" or "#"
; after a value is read as part of it.

[paths]
exiftool = %USERPROFILE%\AppData\Local\Programs\ExifTool\exiftool.exe
data_dir = data
; The library opened at startup.
default_db = photo_index.db

[model]
; CLIP architecture and its pretrained weights. Changing them changes every embedding:
; a library indexed with one cannot be searched with another.
name = ViT-H-14
pretrained = laion2b_s32b_b79k
; Keep the photo's aspect ratio, padding up to this ratio, at this input size.
preserve_full_frame = true
max_aspect_ratio = 1.4
force_image_size = 512

[candidates]
; Zero-shot tags CLIP is asked about, beside every tag in the tree that is not a person.
tags = Landscape, Portrait, Nature, Urban, Sunset, Sunrise, Night, Ocean, Mountain, Forest, Animal, Cat, Dog, Food, Indoor, Outdoor, Vehicle, Flower, Architecture, Party, Wedding, Beach, Sports, Concert

[faces]
; Smallest face in pixels, the confidence to keep a face, and MTCNN's per-stage thresholds.
min_face_size = 20
confidence_threshold = 0.85
mtcnn_thresholds = 0.6, 0.7, 0.7

[renaming]
; The pattern Smart Rename names photos with.
format = {grouping} - {index} - {caption}
